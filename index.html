<!DOCTYPE html>
<html lang="am" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bete Yoseph&Estiphanos - Creative Writing Hub</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Dynamic Light/Dark Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 247, 237, 0.88);
            color: #1e293b;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(249, 115, 22, 0.4);
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(234, 88, 12, 0.15);
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .bg-virgin-mary {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
            background-attachment: fixed;
        }

        .dark .bg-virgin-mary {
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
            background-attachment: fixed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-virgin-mary min-h-screen text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 p-4 max-w-md mx-auto">

    <!-- Top Theme & Control Bar -->
    <div class="flex justify-between items-center mb-4">
        <span class="text-xs font-bold text-amber-500 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">Agape Light</span>
        <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-xl glass-panel text-amber-500 text-sm cursor-pointer">
            🌙 / ☀️
        </button>
    </div>

    <!-- Header/Banner Section -->
    <header class="text-center my-4">
        <h1 class="text-2xl font-black text-amber-500 dark:text-amber-400">ቤተ ዮሴፍወእስጢፋኖስ</h1>
        <p class="text-xs text-amber-600 dark:text-amber-200/70 mt-1">የፈጠራ ጽሁፍ እና መንፈሳዊ ማዕከል</p>
    </header>

    <!-- 🕒 Live Date & Time Bar -->
    <div class="glass-panel p-3 mb-4 text-center rounded-xl border border-amber-500/30">
        <div id="liveClock" class="text-xl font-extrabold text-amber-500 tracking-wider mb-1">00:00:00 AM</div>
        <div id="liveDate" class="text-xs font-medium text-amber-600 dark:text-amber-200/80">ቀን በመጫን ላይ...</div>
    </div>

    <!-- ☦️ የእመቤታችን የድንግል ማርያም ሥዕል እና ጸሎት Card -->
    <div class="glass-panel p-4 mb-5 text-center rounded-2xl border border-amber-500/40 shadow-xl">
        <div class="relative inline-block rounded-xl overflow-hidden border-2 border-amber-400/60 p-1 bg-amber-500/10">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Virgin_Mary_Ethiopian_Icon.jpg/480px-Virgin_Mary_Ethiopian_Icon.jpg" 
                 alt="የድንግል ማርያም ሥዕል" 
                 class="w-48 h-auto mx-auto rounded-lg shadow-md object-cover"
                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1544816155-12df9643f363?q=80&w=500';">
        </div>
        <p class="mt-3 text-sm md:text-base font-extrabold text-amber-600 dark:text-amber-300 tracking-wide">
            "የኔ እናት አንቺ ከጎኔ አትለይኝ"
        </p>
    </div>

    <!-- Main Content Sections -->
    <main class="space-y-6">

        <!-- 1. የመዝሙር ግጥሞች -->
        <section class="glass-panel p-5 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold text-amber-600 dark:text-amber-300 mb-3">🎵 የመዝሙር ግጥሞች</h2>
            <div class="space-y-2">
                <input type="text" id="hymnTitle" placeholder="የመዝሙሩ ርዕስ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none">
                <textarea id="hymnBody" rows="3" placeholder="የመዝሙሩን ግጥም እዚህ ጻፍ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none"></textarea>
                <button onclick="saveHymn()" class="w-full btn-primary p-2 rounded-lg text-xs font-bold cursor-pointer">💾 የመዝሙር ግጥም መዝግብ</button>
                <div id="hymnsList" class="mt-3 space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </section>

        <!-- 2. መደበኛ ግጥሞች -->
        <section class="glass-panel p-5 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold text-amber-600 dark:text-amber-300 mb-3">✍️ መደበኛ ግጥሞች</h2>
            <div class="space-y-2">
                <input type="text" id="poemTitle" placeholder="የግጥሙ ርዕስ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none">
                <textarea id="poemBody" rows="3" placeholder="ግጥሙን እዚህ ጻፍ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none"></textarea>
                <button onclick="savePoem()" class="w-full btn-primary p-2 rounded-lg text-xs font-bold cursor-pointer">💾 ግጥሙን መዝግብ</button>
                <div id="poemsList" class="mt-3 space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </section>

        <!-- 3. ድርሰቶች እና ታሪኮች -->
        <section class="glass-panel p-5 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold text-amber-600 dark:text-amber-300 mb-3">📖 ድርሰት እና አጫጭር ታሪኮች</h2>
            <div class="space-y-2">
                <input type="text" id="storyTitle" placeholder="የድርሰቱ ርዕስ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none">
                <textarea id="storyBody" rows="4" placeholder="ድርሰቱን እዚህ ጻፍ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none"></textarea>
                <button onclick="saveStory()" class="w-full btn-primary p-2 rounded-lg text-xs font-bold cursor-pointer">💾 ድርሰቱን መዝግብ</button>
                <div id="storiesList" class="mt-3 space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </section>

        <!-- 4. የጸሎትና የመንፈሳዊ መጻሕፍት ማዕከል -->
        <section class="glass-panel p-5 rounded-2xl shadow-xl border border-amber-500/50">
            <div class="flex items-center justify-between mb-3 border-b border-amber-500/30 pb-2">
                <h2 class="text-base font-bold text-amber-600 dark:text-amber-300">☦️ የጸሎትና መጻሕፍት ማዕከል</h2>
            </div>
            
            <div class="flex gap-2 mb-3">
                <button onclick="switchPrayerTab('prayers')" id="btnTabPrayers" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 cursor-pointer">🙏 ጸሎታት</button>
                <button onclick="switchPrayerTab('books')" id="btnTabBooks" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-900/80 text-amber-200 border border-amber-500/30 cursor-pointer">📚 መጻሕፍት</button>
            </div>

            <!-- Tab 1: ጸሎታት -->
            <div id="tabPrayersContent" class="space-y-2">
                <input type="text" id="prayerTitle" placeholder="የጸሎቱ ርዕስ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none">
                <textarea id="prayerBody" rows="3" placeholder="የጸሎቱን ጽሁፍ እዚህ አስገባ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none"></textarea>
                <button onclick="savePrayer()" class="w-full btn-primary p-2 rounded-lg text-xs font-bold cursor-pointer">💾 ጸሎቱን መዝግብ</button>
                <div id="prayersList" class="mt-2 space-y-2 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- Tab 2: መጻሕፍት -->
            <div id="tabBooksContent" class="space-y-2 hidden">
                <input type="text" id="bookTitle" placeholder="የመጽሐፉ ርዕስ / ደራሲ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none">
                <textarea id="bookBody" rows="3" placeholder="የመጽሐፉን ዋና ዋና ነጥቦች እዚህ አስገባ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none"></textarea>
                <button onclick="saveSpiritualBook()" class="w-full btn-primary p-2 rounded-lg text-xs font-bold cursor-pointer">💾 መጽሐፉን ሴቭ አድርግ</button>
                <div id="booksList" class="mt-2 space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </section>

        <!-- 5. AI ረዳት ሀሳብ ማከማቻ -->
        <section class="glass-panel p-5 rounded-2xl shadow-xl">
            <h2 class="text-base font-bold text-amber-600 dark:text-amber-300 mb-2">🤖 Gemini AI ሀሳብ ማከማቻ</h2>
            <div class="space-y-2">
                <textarea id="aiPrompt" rows="2" placeholder="ለ Gemini የምትጠይቀውን ሀሳብ እዚህ አስቀምጥ..." class="w-full p-2 border border-amber-500/30 rounded-lg text-xs bg-slate-900 text-amber-100 focus:outline-none"></textarea>
                <button onclick="saveAiPrompt()" class="w-full btn-primary p-2 rounded-lg text-xs font-bold cursor-pointer">💾 ሀሳቡን ሴቭ አድርግ</button>
                <div id="aiPromptsList" class="mt-2 space-y-2 max-h-32 overflow-y-auto"></div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center my-6 text-xs text-amber-600 dark:text-amber-400/60">
        <p>© 2026 - ቤተ ዮሴፍወእስጢፋኖስ (Creative Writing Hub)</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // 1. Live Clock & Date
        function updateLiveDateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const dateString = now.toLocaleDateString('am-ET', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            const clockEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            if (clockEl) clockEl.textContent = timeString;
            if (dateEl) dateEl.textContent = dateString;
        }
        setInterval(updateLiveDateTime, 1000);

        // 2. Tabs Switcher for Prayers & Books
        function switchPrayerTab(tab) {
            const prayersTab = document.getElementById('tabPrayersContent');
            const booksTab = document.getElementById('tabBooksContent');
            const btnPrayers = document.getElementById('btnTabPrayers');
            const btnBooks = document.getElementById('btnTabBooks');

            if (tab === 'prayers') {
                prayersTab.classList.remove('hidden');
                booksTab.classList.add('hidden');
                btnPrayers.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 cursor-pointer";
                btnBooks.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-900/80 text-amber-200 border border-amber-500/30 cursor-pointer";
            } else {
                booksTab.classList.remove('hidden');
                prayersTab.classList.add('hidden');
                btnBooks.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 cursor-pointer";
                btnPrayers.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-900/80 text-amber-200 border border-amber-500/30 cursor-pointer";
            }
        }

        // 3. Generic Save & Render Logic
        function saveItem(key, titleId, bodyId, renderFunc) {
            const titleEl = document.getElementById(titleId);
            const bodyEl = document.getElementById(bodyId);
            const title = titleEl ? titleEl.value.trim() : '';
            const body = bodyEl ? bodyEl.value.trim() : '';
            
            if (!body || (titleEl && !title)) return alert('እባክዎን መረጃውን ሙሉ በሙሉ ያስገቡ!');
            
            const items = JSON.parse(localStorage.getItem(key) || '[]');
            items.push({ id: Date.now(), title, body });
            localStorage.setItem(key, JSON.stringify(items));
            
            if (titleEl) titleEl.value = '';
            if (bodyEl) bodyEl.value = '';
            renderFunc();
        }

        function renderItems(key, containerId, icon) {
            const items = JSON.parse(localStorage.getItem(key) || '[]');
            const container = document.getElementById(containerId);
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = `<p class="text-xs text-amber-600 dark:text-amber-200/40 text-center py-1">ምንም መረጃ የለም።</p>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="p-2.5 bg-slate-950/80 rounded-lg border border-amber-500/20 text-xs">
                    <div class="flex justify-between items-center text-amber-300 font-bold mb-1">
                        <span>${icon} ${item.title || 'ማስታወሻ'}</span>
                        <button onclick="deleteItem('${key}', ${item.id})" class="text-red-400 hover:text-red-300 cursor-pointer">🗑️</button>
                    </div>
                    <p class="whitespace-pre-line text-amber-100/90">${item.body}</p>
                </div>
            `).join('');
        }

        function deleteItem(key, id) {
            let items = JSON.parse(localStorage.getItem(key) || '[]');
            items = items.filter(item => item.id !== id);
            localStorage.setItem(key, JSON.stringify(items));
            refreshAll();
        }

        // Specific Savers & Renderers
        function saveHymn() { saveItem('yosef_hymns', 'hymnTitle', 'hymnBody', renderHymns); }
        function renderHymns() { renderItems('yosef_hymns', 'hymnsList', '🎵'); }

        function savePoem() { saveItem('yosef_poems', 'poemTitle', 'poemBody', renderPoems); }
        function renderPoems() { renderItems('yosef_poems', 'poemsList', '✍️'); }

        function saveStory() { saveItem('yosef_stories', 'storyTitle', 'storyBody', renderStories); }
        function renderStories() { renderItems('yosef_stories', 'storiesList', '📖'); }

        function savePrayer() { saveItem('yosef_prayers', 'prayerTitle', 'prayerBody', renderPrayers); }
        function renderPrayers() { renderItems('yosef_prayers', 'prayersList', '🙏'); }

        function saveSpiritualBook() { saveItem('yosef_spiritual_books', 'bookTitle', 'bookBody', renderSpiritualBooks); }
        function renderSpiritualBooks() { renderItems('yosef_spiritual_books', 'booksList', '📚'); }

        function saveAiPrompt() {
            const bodyEl = document.getElementById('aiPrompt');
            const body = bodyEl ? bodyEl.value.trim() : '';
            if (!body) return alert('እባክዎን ሀሳብ ያስገቡ!');
            const items = JSON.parse(localStorage.getItem('yosef_ai_prompts') || '[]');
            items.push({ id: Date.now(), title: 'AI ሀሳብ', body });
            localStorage.setItem('yosef_ai_prompts', JSON.stringify(items));
            bodyEl.value = '';
            renderAiPrompts();
        }
        function renderAiPrompts() { renderItems('yosef_ai_prompts', 'aiPromptsList', '🤖'); }

        function refreshAll() {
            updateLiveDateTime();
            renderHymns();
            renderPoems();
            renderStories();
            renderPrayers();
            renderSpiritualBooks();
            renderAiPrompts();
        }

        window.addEventListener('DOMContentLoaded', refreshAll);
    </script>
</body>
</html>
